name: PR Code Standards Review

on:
  pull_request:
    branches: [ '*' ]

jobs:
  ai-code-review:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v3
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install openai GitPython

    - name: Generate PR Diff
      id: pr-diff
      env:
        GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
      run: |
        git diff ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }} > pr_diff.txt
        echo "Generated PR diff"

    - name: Review Code with ChatGPT
      env:
        OPENAI_API_KEY: ${{ secrets.CHATGPT }}
      run: |
        python << EOF
        import os
        import openai

        # Read coding standards (you should replace this with your actual standards file)
        with open('CODING_STANDARDS.md', 'r') as standards_file:
            coding_standards = standards_file.read()

        # Read PR diff
        with open('pr_diff.txt', 'r') as diff_file:
            pr_diff = diff_file.read()

        # Set up OpenAI client
        openai.api_key = os.getenv('OPENAI_API_KEY')

        # Prepare the prompt
        prompt = f"""
        Review the following code changes against our coding standards:

        Coding Standards:
        {coding_standards}

        Code Diff:
        {pr_diff}

        Provide a detailed review focusing on:
        1. Compliance with coding standards
        2. Potential improvements
        3. Code quality issues
        4. Suggestions for refactoring

        Format your response as a structured code review with:
        - Compliance Score (0-100)
        - Detailed Findings
        - Specific Recommendations
        """

        # Call OpenAI API
        response = openai.ChatCompletion.create(
            model="gpt-4-turbo",
            messages=[
                {"role": "system", "content": "You are a senior software engineer reviewing code changes."},
                {"role": "user", "content": prompt}
            ],
            max_tokens=1000
        )

        # Save the review
        review_text = response.choices[0].message.content
        with open('code_review.md', 'w') as review_file:
            review_file.write(review_text)

        print("Code review generated successfully.")
        EOF

    - name: Post Review as PR Comment
      env:
        GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: |
        gh pr comment $PR_NUMBER -F code_review.md

    - name: Upload Review Artifact
      uses: actions/upload-artifact@v3
      with:
        name: code-review
        path: code_review.md
