name: PR Feedback with Custom GPT

on:
  pull_request:
    types:
      - opened
      - synchronize

jobs:
  gpt-feedback:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Get list of changed files
        run: |
          if git cat-file -e ${{ github.event.before }} 2>/dev/null; then
            git diff --name-only --diff-filter=AMRC ${{ github.event.before }} ${{ github.sha }} > changed_files.txt
          else
            git diff --name-only --diff-filter=AMRC $(git rev-list --max-parents=0 HEAD) HEAD > changed_files.txt
          fi

      - name: Send files to Custom GPT
        env:
          GPT_ENDPOINT: https://chatgpt.com/g/g-9m1JIKwVX-slash
          CHATGPT_ACCESS_TOKEN: ${{ secrets.CHATGPT_ACCESS_TOKEN }}
          GITHUB_PR: ${{ github.event.pull_request.number }}
        run: |
          feedback=""
          while IFS= read -r file; do
            if [ -f "$file" ]; then
              content=$(cat "$file")
              response=$(curl -s -X POST "$GPT_ENDPOINT" \
                -H "Content-Type: application/json" \
                -H "Authorization: Bearer $CHATGPT_ACCESS_TOKEN" \
                -d "$(jq -n --arg file_name "$file" --arg file_content "$content" --arg pr_number "$GITHUB_PR" '{file_name: $file_name, file_content: $file_content, pr_number: $pr_number}')")

              echo "Response from GPT endpoint for file $file:"
              echo "$response"

              # Validate response format
              if echo "$response" | jq empty 2>/dev/null; then
                feedback="$feedback\n\nFile: $file\n$response"
              else
                echo "Invalid response for file $file: $response"
                feedback="$feedback\n\nFile: $file\n[Error: Invalid response from GPT endpoint]"
              fi
            fi
          done < changed_files.txt
          echo "$feedback" > feedback.txt

      - name: Post feedback as comments
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          if [ -s feedback.txt ]; then
            while IFS= read -r line; do
              if [ -n "$line" ]; then
                sanitized_line=$(echo "$line" | jq -R .)
                curl -s --fail -X POST "https://api.github.com/repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" \
                  -H "Authorization: Bearer $GH_TOKEN" \
                  -H "Content-Type: application/json" \
                  -d "{\"body\": $sanitized_line}" || echo "Failed to post comment: $sanitized_line"
              fi
            done < feedback.txt
          else
            echo "No feedback to post."
          fi
