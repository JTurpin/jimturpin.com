name: Custom GPT Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  gpt-review:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the code
      - name: Checkout Code
        uses: actions/checkout@v3

      # Step 2: Call Custom GPT
      - name: Call Custom GPT
        id: call-gpt
        env:
          CHATGPT_ACCESS_TOKEN: ${{ secrets.CHATGPT_ACCESS_TOKEN }}
        run: |
          echo "Calling Custom GPT..."
          curl -X POST \
            -H "Authorization: Bearer $CHATGPT_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{
                  "prompt": "Provide a detailed code review for the changes in this pull request.",
                  "max_tokens": 500
                }' \
            https://api.openai.com/v1/completions \
            -o gpt-response.json
          echo "GPT response saved to gpt-response.json"

      # Step 3: Post GPT Response as a Pull Request Comment
      - name: Post GPT Response to PR
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            const gptOutput = JSON.parse(fs.readFileSync('gpt-response.json', 'utf8'));

            github.rest.issues.createComment({
              issue_number: context.payload.pull_request.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `### Custom GPT Code Review:\n\n${gptOutput.choices[0].text}`
            });
