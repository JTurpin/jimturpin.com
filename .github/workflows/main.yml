name: Send PR to Custom GPT

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  analyze-pr:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2
      with:
        fetch-depth: 2  # Fetch the last two commits for diffing

    - name: Get Pull Request Diff
      id: diff
      run: |
        # Get the PR diff between the last commit and HEAD
        git diff HEAD~1 HEAD > pr_diff.txt

    - name: Send Pull Request Content to Custom GPT
      env:
        GPT_API_URL: "https://chatgpt.com/g/g-9m1JIKwVX-slash"
      run: |
        pr_title="${{ github.event.pull_request.title }}"
        pr_body="${{ github.event.pull_request.body }}"
        pr_diff=$(cat pr_diff.txt)

        curl -X POST "$GPT_API_URL" \
          -H "Authorization: Bearer ${{ secrets.CHATGPT }}" \
          -H "Content-Type: application/json" \
          -d '{
                "title": "'"${pr_title}"'",
                "body": "'"${pr_body}"'",
                "diff": "'"${pr_diff}"'"
              }'
